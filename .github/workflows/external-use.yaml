---
name: External Use
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch: null
permissions: read-all
jobs:
  sapid-test:
    name: sapid-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          use-public-rspm: true

      - name: Install dependencies (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libarchive-dev libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev \
            libfribidi-dev libharfbuzz-dev libnetcdf-dev libuv1-dev \
          && sudo apt-get clean \
          && sudo rm -rf /var/lib/apt/lists/*

      - name: Install dependencies (macOS)
        if: contains(matrix.os, 'macos')
        run: |
          brew update
          brew install netcdf
          GETTEXT_PREFIX="$(brew --prefix gettext)"
          mkdir -p ~/.R
          cat >> ~/.R/Makevars <<EOF
          CPPFLAGS += -I${GETTEXT_PREFIX}/include
          LDFLAGS  += -L${GETTEXT_PREFIX}/lib -lintl
          EOF

      - name: Install dependencies and package
        shell: Rscript {0}
        run: |
          repos <- c(
            "https://adafede.r-universe.dev",
            "https://taxonomicallyinformedannotation.r-universe.dev",
            "https://bioc.r-universe.dev",
            "https://cran.r-universe.dev"
          )
          if (!requireNamespace("remotes", quietly = TRUE)) {
            install.packages("remotes", repos = repos)
          }
          remotes::install_deps(".", dependencies = TRUE, repos = repos)
          install.packages(".", repos = NULL, type = "source")

      - name: Run smoke check and tests
        shell: Rscript {0}
        run: |
          library(sapid)
          stopifnot(identical(
            harmonize_terms(dictionary_generic, c("amer", "boisé")),
            c("BITTER", "WOODY")
          ))
          res <- tinytest::test_package("sapid")
          print(summary(res))
          stopifnot(all(as.logical(res)))
